[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velot"
version = "0.1.0"
description = "Optimal Transport RNA Velocity with Flow Matching Smoothing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "scanpy>=1.9",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "POT>=0.8",
    "scvelo>=0.2.4",
    "tqdm>=4.60",
    "ipywidgets"
]

[project.optional-dependencies]
plot = ["seaborn>=0.11"]

[tool.setuptools.packages.find]
include = ["velot*"]